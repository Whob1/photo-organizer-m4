[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m4-photo-organizer"
version = "0.2.0"
description = "Automatic photo and video organizer and enhancer for Apple M4 using rclone-mounted Google Photos"
readme = "README.md"
authors = [{ name = "Sheldon" }]
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12",
  "rich>=13",
  "pydantic>=2",
  "aiofiles>=24",
  "aiosqlite>=0.20",
  "psutil>=6",
  "Pillow>=10",
  "pillow-heif>=0.18",
  "exifread>=3.0",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "piexif>=1.1",
  "imagehash>=4.3",
  "onnxruntime>=1.18",
  "tqdm>=4.66"
]

[project.scripts]
photoorg = "m4_photo_organizer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

